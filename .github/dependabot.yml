# Keeps the third-party action pins in .github/workflows/ up to date.
# Actions are pinned to full-length commit SHAs (supply-chain hardening);
# Dependabot updates the SHA and the trailing "# vX.Y.Z" comment together.
# See https://docs.github.com/en/code-security/dependabot/working-with-dependabot/keeping-your-actions-up-to-date-with-dependabot
#
# The `docker` entry repins the devcontainer base image digest in
# .devcontainer/Dockerfile whenever a new multi-arch manifest list digest is
# published for the pinned tag, keeping the digest pin from going stale.
# Known limitation: GHCR exposes no publication date (no Last-Modified header),
# so Docker cooldown fails open and Dependabot PRs carry a
# "Cooldown could not be applied" warning. Cosmetic only; updates still work.
# See https://github.com/dependabot/dependabot-core/issues/16114 (Docker Hub
# fixed by #16143; GHCR still open in #16328).
#
# The `uv` entry keeps uv.lock fresh (verified: Dependabot supports the `uv`
# package-ecosystem; see https://docs.astral.sh/uv/guides/integration/dependabot/).
# `cooldown.default-days: 7` delays version-update PRs until a release is a
# week old, reducing the chance of ingesting a freshly compromised release.
# Security updates are never delayed by cooldown.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Same 7-day stance as `uv` below: version-update PRs wait until a release
    # is a week old. (The platform already applies a 3-day default; this makes
    # the 7-day intent explicit. Security updates are never delayed.)
    cooldown:
      default-days: 7
    # Split by update-type so fetch-metadata's roll-up `update-type` stays
    # accurate: a single catch-all group reports the *highest* semver change
    # in the PR, so one minor would block auto-merge of an all-patch group.
    # Patch-only groups roll up to `version-update:semver-patch` and can
    # match the auto-merge gate; minor/major groups fail closed.
    groups:
      github-actions-patch:
        patterns:
          - "*"
        update-types:
          - patch
      github-actions-minor-major:
        patterns:
          - "*"
        update-types:
          - minor
          - major
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Direct deps in pyproject.toml use bare lower bounds (>=X.Y.Z). Without
    # this, Dependabot's default strategy only bumps uv.lock whenever the new
    # version still satisfies the existing bound, so core deps drift in the
    # lockfile while the manifest keeps stale minimums (e.g. PR #20: openai
    # 3.8.0 -> 3.13.0 with no pyproject.toml change). `increase` raises the
    # lower bound in pyproject.toml alongside the lockfile on every update.
    # See https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-dependabot.yml#versioning-strategy
    versioning-strategy: increase
    cooldown:
      default-days: 7
    # Split by update-type so fetch-metadata's roll-up `update-type` stays
    # accurate: a single catch-all group reports the *highest* semver change
    # in the PR, so one minor would block auto-merge of an all-patch group.
    # Patch-only groups roll up to `version-update:semver-patch` and can
    # match the auto-merge gate; minor/major groups fail closed.
    groups:
      uv-patch:
        patterns:
          - "*"
        update-types:
          - patch
      uv-minor-major:
        patterns:
          - "*"
        update-types:
          - minor
          - major
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    # GHCR (ghcr.io/astral-sh/uv) publishes no tag/digest publication date, so
    # this cooldown cannot currently be enforced for the base image and
    # Dependabot emits "Cooldown could not be applied because no publication
    # date was available from the registry" on every docker PR (upstream
    # dependabot-core #16114; Docker Hub fixed by #16143, GHCR open in #16328).
    # `exclude` skips cooldown for that image before the warning is recorded,
    # silencing the banner while keeping today's fail-open behavior (updates
    # are never delayed either way). The exclude name is the registry-stripped
    # image path, not the full ghcr.io reference. `default-days: 7` stays for
    # any future docker deps and can govern this image again if GHCR dates
    # land — drop the exclude entry then. Security updates are never delayed.
    cooldown:
      default-days: 7
      exclude:
        - astral-sh/uv
