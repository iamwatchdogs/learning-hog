name: Bug report
description: Report something in learning-hog that is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Thank you for reporting a bug

        The more precise your report, the faster the fix. Paste real output
        instead of describing it from memory, and confirm the bug on the
        latest `main` first, as it may already be fixed.

  - type: checkboxes
    id: existing-issue
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the bug you encountered.
      options:
        - label: I have searched the existing issues
          required: true

  - type: checkboxes
    id: reproducibility
    attributes:
      label: Reproducibility
      description: Ticking this confirms you checked the bug yourself; it saves a round-trip of questions.
      options:
        - label: I can reproduce this on the latest `main` (or the latest release)
          required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Walk through it step by step, including the exact commands or code you ran.
      placeholder: |
        1. Run '...'
        2. With this configuration '...'
        3. See the error '...'
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
      description: A concise description of the behavior you expected instead.

  - type: textarea
    id: actual-behavior
    attributes:
      label: What actually happened?
      description: Paste the real error or output. Do not paraphrase it.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Copy the output of `learning-hog --version`. If you ran it from source, mention the commit you are on.
      placeholder: "e.g. learning-hog 1.0.0, or main @ abc1234"
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      description: Which operating system were you using when the bug occurred?
      multiple: true
      options:
        - Linux
        - macOS
        - Windows

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell

  - type: dropdown
    id: ai-assistance
    attributes:
      label: AI assistance
      description: >
        Disclosure required: name the tool(s) used for this issue, if any.
        AI-assisted content must be reviewed and edited by a human before
        submission. Undisclosed AI assistance may get the issue closed.
      multiple: true
      options:
        - No AI assistance
        - Claude Code
        - GitHub Copilot
        - Cursor
        - Other (named below)
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else we should know, including which AI tool you used when "Other (named below)" is selected.

  - type: checkboxes
    id: code-of-conduct
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/iamwatchdogs/learning-hog/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
