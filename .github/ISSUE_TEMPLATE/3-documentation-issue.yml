name: Documentation issue
description: Report missing, incorrect, or confusing documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        ## Thank you for improving the docs

        Clear reports make fixes fast: point at the exact file or section,
        say what is wrong, and paste the misleading text if you can.

  - type: checkboxes
    id: existing-issue
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if a documentation issue already exists for this.
      options:
        - label: I have searched the existing issues
          required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: What kind of issue is it?
      multiple: true
      options:
        - Documentation is missing
        - Documentation is incorrect
        - Documentation is confusing
        - Example or command does not work
        - Something else

  - type: textarea
    id: what-is-the-issue
    attributes:
      label: What is the issue?
      description: What is missing, wrong, or misleading? If a command or example does not work, include what you ran and what happened.
    validations:
      required: true

  - type: textarea
    id: where-did-you-find-it
    attributes:
      label: Where did you find it?
      description: File paths, section headings, or page URLs. Paste the text you expected to be different.

  - type: dropdown
    id: ai-assistance
    attributes:
      label: AI assistance
      description: >
        Disclosure required: name the tool(s) used for this issue, if any.
        AI-assisted content must be reviewed and edited by a human before
        submission. Undisclosed AI assistance may get the issue closed.
      multiple: true
      options:
        - No AI assistance
        - Claude Code
        - GitHub Copilot
        - Cursor
        - Other (named below)
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else we should know, including which AI tool you used when "Other (named below)" is selected.

  - type: checkboxes
    id: code-of-conduct
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/iamwatchdogs/learning-hog/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
