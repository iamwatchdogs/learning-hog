# zizmor: static analysis for the workflow files themselves. Findings upload to
# the Security tab but never fail the job — enforce via a code-scanning
# merge-protection ruleset if you want a blocking gate.

name: GitHub Actions Security Analysis with zizmor

on:
  push:
    branches: [main]
    paths:
      - ".github/**"
  pull_request:
    paths:
      - ".github/**"

permissions: {} # deny-all default; scopes are granted per job below

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload findings to Advanced Security
      contents: read          # private repos: checkout for SARIF upload
      actions: read           # private repos: read workflow metadata
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github      # zizmor only reads workflow files.

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
