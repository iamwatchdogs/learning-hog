name: CD

# Flow: CI (reusable workflow call) -parallel- Build artifacts (OS matrix)
#       -> Publish release.
# `release` needs both, so a red CI or a failed build skips the release and
# fails the workflow. Matrix fail-fast (default true) cancels the remaining
# builds on the first failure.
#
# Triggers:
#   - push of a `v*` tag  -> builds, creates the release if missing, uploads
#   - `release: published` -> builds and appends artifacts to that release
#
# NOTE on attestations: `actions/attest` needs a public repository on
# Free/Pro/Team plans (private repos need Enterprise Cloud). If this repo is
# private without Enterprise, the attest step will fail — remove it or make
# the repo public.
#
# NOTE on triggering: pushing a `v*` tag and then publishing the GitHub
# release both fire this workflow, and both events resolve to the same
# `refs/tags/vX` ref, so the `cd-` concurrency group below serializes the two
# runs. Both runs publish: assets have identical digests, and softprops'
# default `overwrite_files: true` makes the second upload an idempotent
# overwrite. This keeps releases working for tags pushed before this workflow
# existed (only the `release: published` event fires in that case).
#
# NOTE on caching: release builds deliberately restore nothing from the
# Actions cache (setup-uv's `auto` default disables it on tag-push/release
# events). Poisoned cache entries must never be able to influence a release
# artifact (zizmor: cache-poisoning).

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI (reusable)
    permissions:
      contents: read
    with:
      run-all: true
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read      # checkout
      id-token: write     # OIDC for attestation signing
      attestations: write # publish attestations
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: learning-hog-linux
          - os: windows-latest
            asset: learning-hog-windows.exe
          - os: macos-latest
            asset: learning-hog-macos
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup uv with Python 3.13
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Release builds must not restore Actions-cache state (see the
          # caching note in the header); this is also setup-uv's `auto`
          # default for tag-push and release events.
          enable-cache: false
          cache-python: false

      - name: Setup project
        run: uv sync --locked

      - name: Build onefile binary with PyInstaller
        run: >
          uv run pyinstaller --onefile --clean --noconfirm
          --name "${{ matrix.asset }}"
          --paths src
          src/learning_hog/main.py

      - name: Smoke test the binary
        shell: bash
        run: |
          ./dist/"${{ matrix.asset }}" --help
          ./dist/"${{ matrix.asset }}" --version
          ./dist/"${{ matrix.asset }}" find smoke-test

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/${{ matrix.asset }}

      - name: Upload binary as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish to GitHub release
    needs: [ci, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release and upload assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # Tag push -> creates the release if missing; release event ->
          # appends to the published release.
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist/*
          generate_release_notes: true
