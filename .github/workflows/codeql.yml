# CodeQL Advanced setup: scans `python` and `actions` (workflows) on push, PR,
# and weekly (for newly released queries).

# NOTE:
# ----
# Do NOT also enable default setup in the repo settings,
# it disables this workflow and blocks its uploads.

name: "CodeQL Advanced"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

concurrency:
  # Scheduled runs are exempt from cancellation so a push can't silently kill
  # the weekly full-query scan (the push rescans main anyway).
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF findings to the Security tab
      packages: read # fetch internal or private CodeQL packs
      actions: read # private repos: read workflow metadata for SARIF upload
      contents: read # checkout; private repos: SARIF upload

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
