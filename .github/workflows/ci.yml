name: CI

on:
  push:
    paths:
      - "**/*.py"
      - pyproject.toml
      - uv.lock
      - ".github/workflows/ci.yml"
    branches:
      - main
  pull_request:
    paths:
      - "**/*.py"
      - pyproject.toml
      - uv.lock
      - ".github/workflows/ci.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci-pipeline:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13", "3.14"]

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Setup uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Setup project
        run: uv sync --locked

      - parallel:
          - name: Run linting
            run: uv run ruff check src tests

          - name: Run type checking
            run: uv run ty check src

          - name: Run tests
            run: uv run pytest --cov-report=xml

          - name: Run precommit hooks
            uses: j178/prek-action@v3.0.0
            env:
              SKIP: ruff-check,ruff-format,ty,pytest-testmon,no-commit-to-branch

      # Only upload on pushes to main (direct commits + PR merges land here as
      # push events). PR runs, tag builds, dispatches, and reusable CD calls skip it.
      - name: Upload coverage to Codecov
        if: |
          matrix.os == 'ubuntu-latest' &&
          matrix.python-version == '3.13' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7.0.0
        with:
          files: coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
