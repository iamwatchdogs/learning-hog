name: Assign default owner

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
  workflow_run:
    workflows: ["CodeQL Advanced"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEFAULT_ASSIGNEE: ${{ github.repository_owner }}

jobs:
  assign-new-work:
    name: Assign new issue or pull request
    if: ${{ github.event_name == 'issues' || github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Assign repository owner
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/assignees" \
            -f "assignees[]=${DEFAULT_ASSIGNEE}"

  assign-code-scanning-alerts:
    name: Assign unassigned code-scanning alerts
    if: >-
      ${{ (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Assign repository owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api \
            --paginate \
            "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&assignees=none&per_page=100" \
            --jq '.[].number' \
          | xargs -r -I{} gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts/{}" \
              -f "assignees[]=${DEFAULT_ASSIGNEE}"
