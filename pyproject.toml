[project]
name = "learning-hog"
version = "1.0.0"
description = "A simple project that gather all valuable resources to learn any concept."
readme = "README.md"
authors = [
    { name = "Shamith Nakka", email = "shamith301102@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "msgspec>=0.21.1",
    "pydantic-settings>=2.15.0",
    "typer>=0.27.2",
]

[project.scripts]
learning-hog = "learning_hog:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-testmon>=2.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

# ---------------------------------------------------------------------------
# ty — strict type checking
# ---------------------------------------------------------------------------
[tool.ty]
rules = { all = "error" }

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.environment]
python-version = "3.13"

[tool.ty.terminal]
error-on-warning = true

# ---------------------------------------------------------------------------
# ruff — strict linting + Google docstrings
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py313"
preview = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "ANN",    # flake8-annotations
    "S",      # flake8-bandit (security)
    "BLE",    # flake8-blind-except
    "FBT",    # flake8-boolean-trap
    "C4",     # flake8-comprehensions
    "C90",    # mccabe
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "FA",     # flake8-future-annotations
    "ICN",    # flake8-import-conventions
    "INP",    # flake8-no-pep420
    "LOG",    # flake8-logging
    "G",      # flake8-logging-format
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "PYI",    # flake8-pyi
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SIM",    # flake8-simplify
    "SLOT",   # flake8-slots
    "TID",    # flake8-tidy-imports
    "TC",     # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "TD",     # flake8-todos
    "TRY",    # tryceratops
    "PERF",   # perflint
    "FURB",   # refurb
    "RUF",    # ruff-specific rules
    "D",      # pydocstyle
    "DOC",    # pydoclint (args/returns match signatures)
]
ignore = [
    "missing-trailing-comma",
    "single-line-implicit-string-concatenation",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["unused-import", "undocumented-public-package"]
"tests/**/*.py" = ["assert", "D", "ANN", "ARG"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["learning_hog"]

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=learning_hog --cov-report=term-missing -v -n auto"
