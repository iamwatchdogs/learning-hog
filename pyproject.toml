[project]
name = "learning-hog"
version = "1.0.0"
description = "A simple project that gather all valuable resources to learn any concept."
readme = "README.md"
authors = [
    { name = "Shamith Nakka", email = "shamith301102@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    # --- LLM core (openai-sdk path): parse filters / rerank / summarize via OPENAI_BASE_URL/MODEL/API_KEY ---
    "openai>=3.8.0",

    # --- LLM helper: token-count for chat in-prompt RAG over path.json ---
    "tiktoken>=0.14.0",

    # --- HTTP default: all API adapters (GitHub/StackExchange/OCW/books/Reddit/Bluesky/SearXNG) + HEAD validator ---
    "httpx>=0.28.1",

    # --- Anti-bot fallback: TLS impersonation when httpx gets 403/WAF; pairs with residential proxies ---
    "curl-cffi>=0.16.3",

    # --- Validation + config: strict local check of LLM JSON; env-based settings ---
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",

    # --- Fast serialization: cache/*.json 7d TTL + domain structs ---
    "msgspec>=0.21.1",

    # --- Registry: sources/*.yaml skill files (msgspec.yaml wraps this, still required) ---
    "pyyaml>=6.0.3",

    # --- CLI/UX: Typer app + Rich tables; prompt-toolkit REPL for `learn chat`; mdurl link handling ---
    "typer>=0.27.2",
    "prompt-toolkit>=3.0.53",
    "mdurl>=0.1.2",

    # --- Cache + resilience: cross-OS cache dir; retries/backoff; flexible date parsing for freshness score ---
    "platformdirs>=4.11.7",
    "tenacity>=9.1.4",
    "python-dateutil>=2.9.0.post0",
    "dateparser>=1.4.3",

    # --- Typed API clients: GitHub search/pagination, Reddit reads, Bluesky posts, YouTube metadata ---
    "pygithub>=2.10.0",
    "praw>=8.0.3",
    "atproto>=0.0.71",
    "google-api-python-client>=2.200.0",

    # --- Web fallback: Tavily --web search, DuckDuckGo no-key fallback, Apify managed actors ---
    "tavily-python>=0.8.1",
    "ddgs>=9.16.0",
    "apify-client>=3.2.0",

    # --- Transcripts: YouTube captions without API key (needs delays/cache; 429s at scale) ---
    "youtube-transcript-api>=1.2.4",

    # --- Article extraction: Trafilatura body->Markdown; readability/bs4/lxml fallback chain ---
    "trafilatura>=2.2.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "readability-lxml>=0.9",

    # --- Targeted parsing: parsel CSS+XPath fields; selectolax fast path when CPU-bound ---
    "parsel>=1.11.0",
    "selectolax>=0.4.11",

    # --- Browser/crawler (gated): Playwright JS-render only; nodriver stealth only; Crawlee batch miner only ---
    "playwright>=1.62.0",
    "nodriver>=0.50.3",
    "crawlee>=1.10.0",

    # --- Raw-text processing: fix mojibake/accents, sanitize HTML, domain authority + URL normalize ---
    "ftfy>=6.3.1",
    "unidecode>=1.4.0",
    "bleach>=6.4.0",
    "tldextract>=5.3.2",

    # --- Dedup + rank: fuzzy titles, MinHash near-dup descriptions, BM25 relevance, EN filter, frame ops ---
    "rapidfuzz>=3.14.6",
    "datasketch>=2.0.0",
    "rank-bm25>=0.2.2",
    "lingua-language-detector>=2.2.0",
    "polars>=1.44.1",

    # --- Books: OpenStax/Gutenberg PDF + EPUB -> text for `explain` ---
    "pypdf>=6.17.0",
    "ebooklib>=0.20",
]

[project.scripts]
learning-hog = "learning_hog:main"

[project.optional-dependencies]
social = [
    # Deferred: direct X/IG scraping needs logins+proxies, breaks often; link-out in V1.
    "instaloader>=4.15.3",
    "twikit>=2.3.3",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # Cognitive complexity gate (pre-commit + CI via prek); keeps adapters/ranker refactorable.
    "complexipy>=8.0.0",
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    # Async adapter tests (httpx/crawlee are asyncio-native).
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-testmon>=2.2.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.23.1",
    "ruff>=0.16.6",
    "syrupy>=6.0.0",
    # Deterministic freshness/ranking tests (freeze time around published_at).
    "time-machine>=3.5.0",
    "ty>=0.0.78",
]

# ---------------------------------------------------------------------------
# ty — strict type checking
# ---------------------------------------------------------------------------
[tool.ty]
rules = { all = "error" }

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.environment]
python-version = "3.13"

[tool.ty.terminal]
error-on-warning = true

# ---------------------------------------------------------------------------
# ruff — strict linting + Google docstrings
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py313"
preview = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "ANN",    # flake8-annotations
    "S",      # flake8-bandit (security)
    "BLE",    # flake8-blind-except
    "FBT",    # flake8-boolean-trap
    "C4",     # flake8-comprehensions
    "C90",    # mccabe
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "FA",     # flake8-future-annotations
    "ICN",    # flake8-import-conventions
    "INP",    # flake8-no-pep420
    "LOG",    # flake8-logging
    "G",      # flake8-logging-format
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "PYI",    # flake8-pyi
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SIM",    # flake8-simplify
    "SLOT",   # flake8-slots
    "TID",    # flake8-tidy-imports
    "TC",     # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "TD",     # flake8-todos
    "TRY",    # tryceratops
    "PERF",   # perflint
    "FURB",   # refurb
    "RUF",    # ruff-specific rules
    "D",      # pydocstyle
    "DOC",    # pydoclint (args/returns match signatures)
]
ignore = [
    "missing-trailing-comma",
    "single-line-implicit-string-concatenation",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["unused-import", "undocumented-public-package"]
"tests/**/*.py" = ["assert", "D", "ANN", "ARG"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["learning_hog"]

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=learning_hog --cov-report=term-missing -v -n auto"
