default_language_version:
  python: python3.13

exclude: ^(build|dist|\.eggs|\.git|\.hg|\.tox|\.venv|_build|buck-out)$

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        name: "ruff lint"
        args:
          - --fix
          - --exit-non-zero-on-fix
        types_or: [python, pyi]
      - id: ruff-format
        name: "ruff format"
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: ty
        name: "ty type check"
        entry: uv run ty check
        language: system
        pass_filenames: false
        files: ^(src|tests)/

      - id: complexipy
        name: "complexipy complexity gate"
        entry: uv run complexipy src --max-complexity-allowed 15
        language: system
        pass_filenames: false
        files: ^src/.*\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: "hygiene trailing whitespace"
      - id: end-of-file-fixer
        name: "hygiene end of file newline"
      - id: mixed-line-ending
        name: "hygiene mixed line endings"
        args: [--fix=lf]

      - id: check-yaml
        name: "hygiene validate YAML"
      - id: check-toml
        name: "hygiene validate TOML"
      - id: check-json
        name: "hygiene validate JSON"

      - id: check-ast
        name: "hygiene validate Python AST"
      - id: debug-statements
        name: "hygiene block debug statements"
      - id: check-builtin-literals
        name: "hygiene literal builtins"

      - id: check-merge-conflict
        name: "hygiene merge conflict markers"
      - id: check-added-large-files
        name: "hygiene large file guard"
        args: [--maxkb=500]
      - id: no-commit-to-branch
        name: "hygiene protect main branch"
        args: [--branch, main]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        name: "lint markdown"

  # Added `-ignore` option since parallel step block is not yet supported by actionlint
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: "lint github actions workflows"
        args:
          - -ignore
          - 'step must run script with "run" section or run action with "uses" section'

  - repo: local
    hooks:
      - id: pytest-testmon
        name: pytest-testmon on changed Python files
        entry: uv run pytest --testmon --cov=learning_hog
        language: system
        files: ^(tests|src)/.*\.py$
        types: [python]
